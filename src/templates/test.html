<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            padding: 40px;
            max-width: 600px;
            width: 100%;
        }
        
        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }
        
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s;
        }
        
        input:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }
        
        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        
        .submit-btn {
            background: #667eea;
            color: white;
        }
        
        .submit-btn:hover {
            background: #5568d3;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .refresh-btn {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #e0e0e0;
        }
        
        .refresh-btn:hover {
            background: #e0e0e0;
            transform: translateY(-2px);
        }
        
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            animation: fadeIn 0.3s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .modal-content {
            background-color: white;
            margin: auto;
            padding: 30px;
            border-radius: 10px;
            width: 80%;
            max-width: 400px;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            animation: slideIn 0.3s;
        }
        
        @keyframes slideIn {
            from {
                transform: translate(-50%, -60%);
                opacity: 0;
            }
            to {
                transform: translate(-50%, -50%);
                opacity: 1;
            }
        }
        
        .modal-content h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 24px;
        }
        
        .modal-content p {
            color: #666;
            margin-bottom: 20px;
            font-size: 16px;
        }
        
        .modal-content button {
            background: #667eea;
            color: white;
            padding: 10px 30px;
            width: auto;
        }
        
        .modal-content button:hover {
            background: #5568d3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Task Form</h1>
        <form id="taskForm">
            <div class="form-group">
                <label for="taskCd">Task CD</label>
                <input type="text" id="taskCd" name="taskCd" required>
            </div>
            
            <div class="form-group">
                <label for="description">Description</label>
                <input type="text" id="description" name="description" required>
            </div>
            
            <div class="form-group">
                <label for="subTaskCd">Sub Task CD</label>
                <input type="text" id="subTaskCd" name="subTaskCd" required>
            </div>
            
            <div class="form-group">
                <label for="userId">User ID</label>
                <input type="text" id="userId" name="userId" required>
            </div>
            
            <div class="form-group">
                <label for="subTaskShortname">Sub Task Shortname</label>
                <input type="text" id="subTaskShortname" name="subTaskShortname" required>
            </div>
            
            <div class="form-group">
                <label for="date">Date</label>
                <input type="date" id="date" name="date" required>
            </div>
            
            <div class="button-group">
                <button type="button" class="refresh-btn" onclick="clearForm()">Refresh</button>
                <button type="button" class="submit-btn" onclick="submitForm()">Submit</button>
            </div>
        </form>
    </div>
    
    <!-- Modal -->
    <div id="submitModal" class="modal">
        <div class="modal-content">
            <h2>✓ Success</h2>
            <p>Your task has been submitted successfully!</p>
            <button onclick="closeModal()">Close</button>
        </div>
    </div>
    
    <script>
        function clearForm() {
            document.getElementById('taskForm').reset();
        }
        
        function submitForm() {
            const form = document.getElementById('taskForm');
            openModal();
        }
        
        function openModal() {
            document.getElementById('submitModal').style.display = 'block';
        }
        
        function closeModal() {
            document.getElementById('submitModal').style.display = 'none';
            clearForm();
        }
        
        // Close modal when clicking outside of it
        window.onclick = function(event) {
            const modal = document.getElementById('submitModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
